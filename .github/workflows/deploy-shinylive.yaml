name: Deploy Shiny app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Upload exported Shinylive site
        uses: actions/upload-pages-artifact@v3
        with:
          path: assignment2-shiny

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4